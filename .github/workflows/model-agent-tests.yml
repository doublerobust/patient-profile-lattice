name: Model agent local-mock acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test alignment-model.test.mjs
      - name: Repeat deterministic local-mock acceptance
        run: |
          python -m unittest test_agent_e2e test_alignment_browser test_model_agent -v
          python -m unittest test_agent_e2e test_alignment_browser test_model_agent -v
      - name: Full headless regression
        run: python -m unittest discover -v
      - name: Whitespace and reproducible bundle checks
        run: |
          git diff --check
          git diff --exit-code -- static/lattice.js static/renderer3d.js
